name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options: [arm64, x64]
        default: arm64

permissions:
  contents: read

jobs:
  dmg:
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 60
    steps:
      # Как в upstream: actions/checkout падает на сиротских gitlink в .repos
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Build DMG
        run: |
          cp .env.example .env
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch "${{ inputs.arch }}" --verbose

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-macos-${{ inputs.arch }}
          path: release/*.dmg
          if-no-files-found: error
